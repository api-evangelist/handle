aid: handle
name: Handle
description: >-
  Handle (Handle Inc., handle.com) is a San Francisco software company, founded in 2018 by Patrick Hogan,
  Blake Robertson, Lucas Azevedo and Chris Woodard, that builds financial-operations software for the
  construction industry. The Handle platform covers lien and notice management, automated lien-waiver
  exchange, full-service research and verification, automatic state-by-state compliance deadlines, job
  sheets, credit applications, collections and construction-native online payments, unified by what the
  company calls its Construction Data Graph. It is sold to material suppliers, equipment dealers and
  subcontractors — customers named on its own site include Ferguson, ABC Supply, US LBM, Oldcastle,
  EquipmentShare, The Home Depot, Cemex, Builders FirstSource, Vulcan, Heidelberg Materials, Herc Rentals
  and Floor & Decor. Handle markets ERP integrations ("Handle integrates with any ERP") and operates a
  real API host at api.handle.com, and its own status page monitors components named "Main Portal API"
  and "Payment Portal API", but it publishes no developer portal, no API reference, and no
  machine-readable specification of any kind; the only public route to the integration surface is a
  Contact Sales form. Handle is SOC 2 Type 1 and Type 2 compliant and publishes a Vanta-hosted trust
  center. It raised a $27M Series B led by Marbruck with Energize Capital, Suffolk Technologies,
  Liquid 2 Ventures, RXR, WEX and Amex Ventures participating.
